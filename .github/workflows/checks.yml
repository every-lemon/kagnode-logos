name: Assets
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 scripts/verify.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libcairo2 fonts-dejavu-core
      - run: pip install -r requirements-artwork.txt
      - run: python -m unittest discover -s tests -p test_entropy_artwork.py -v
      - run: python scripts/gallery.py --check
      - run: python -m unittest discover -s tests -p test_gallery.py -v
